name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  commit-lint:
    uses: JustShinobi/platform-workflows/.github/workflows/commit-lint.yml@1472c2963006f33d7b15768cf799560ce086aac8

  avoid-empty-prs:
    uses: JustShinobi/platform-workflows/.github/workflows/avoid-empty-prs.yml@1472c2963006f33d7b15768cf799560ce086aac8
